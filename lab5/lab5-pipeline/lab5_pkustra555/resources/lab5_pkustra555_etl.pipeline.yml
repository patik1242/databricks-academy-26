# The main pipeline for lab5_pkustra555

resources:
  pipelines:
    lab5_pkustra555_etl:
      name: lab5_pkustra555_etl
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}

      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        gold_schema: ${var.gold_schema}
        title: netflix_titles
      serverless: true
      root_path: "../src/lab5_pkustra555_etl"

      libraries:
        - glob:
            include: ../src/lab5_pkustra555_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}

