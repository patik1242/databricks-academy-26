# This is a Declarative Automation Bundle definition for lab5_pkustra555.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lab5_pkustra555
  uuid: e3eff93c-4bf3-47df-9ea2-d481dea38a91

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

  bronze_schema:
    description: Bronze schema

  silver_schema:
    description: Silver schema

  gold_schema:
    description: Gold schema

  title:
    description: title of used dataset


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    default: true
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
    presets:
      trigger_pause_status: "PAUSED"
      name_prefix: ""
    variables:
      catalog: dbr_dev
      bronze_schema: pkustra555_bronze
      silver_schema: pkustra555_silver
      gold_schema: pkustra555_gold
      title: netflix_titles
  prod:
    mode: production
    workspace:
      host: https://adb-7405604503619901.1.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/pkustra555@softserve.academy to make sure we only have a single copy.
      root_path: /Workspace/Users/pkustra555@softserve.academy/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      bronze_schema: pkustra555_bronze
      silver_schema: pkustra555_silver
      gold_schema: pkustra555_gold
      title: netflix_titles
    permissions:
      - user_name: pkustra555@softserve.academy
        level: CAN_MANAGE
