# This is a Declarative Automation Bundle definition for lab5_declarative_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lab5_declarative_pipeline
  uuid: 25558f17-8910-4204-a42d-caafaa08a435

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

  bronze_schema:
    description: Bronze schema

  silver_schema:
    description: Silver schema


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    default: true
    workspace:
      host: https://dbc-1d718a34-5ff7.cloud.databricks.com
    presets:
      trigger_pause_status: "PAUSED"
      name_prefix: ""
    variables:
      catalog: dbr_dev
      bronze_schema: pkustra555_bronze
      silver_schema: pkustra555_silver
  prod:
    mode: production
    workspace:
      host: https://dbc-1d718a34-5ff7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/pkustra555@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/pkustra555@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      bronze_schema: pkustra555_bronze
      silver_schema: pkustra555_silver
    permissions:
      - user_name: pkustra555@gmail.com
        level: CAN_MANAGE
